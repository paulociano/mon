<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">MON feature map</title><desc id="desc">Mapa visual das principais funcionalidades do MON Japanese OS.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111e"/><stop offset="1" stop-color="#101b29"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e64d3d"/><stop offset=".5" stop-color="#d7b56d"/><stop offset="1" stop-color="#63d3c2"/></linearGradient></defs>
<rect width="1400" height="500" rx="34" fill="url(#bg)"/><text x="70" y="64" font-family="Arial" font-size="13" font-weight="800" letter-spacing="3" fill="#e64d3d">MON · FEATURE MAP</text><text x="70" y="108" font-family="Georgia" font-size="38" fill="#f4e8d2">Um sistema de aprendizagem, não uma pilha de exercícios.</text><rect x="70" y="132" width="1260" height="2" rx="1" fill="url(#line)" opacity=".8"/>
<g font-family="Arial">
<g transform="translate(70 172)"><rect width="300" height="128" rx="20" fill="#101d2b" stroke="#ffffff" stroke-opacity=".07"/><text x="22" y="31" font-size="12" fill="#d7b56d">01 · ADAPTAÇÃO</text><text x="22" y="61" font-size="18" font-weight="700" fill="#edf1f4">Home Coach</text><text x="22" y="84" font-size="12" fill="#83909d">escolhe a próxima melhor ação</text><text x="22" y="106" font-size="12" fill="#83909d">com base em evidência local</text></g>
<g transform="translate(390 172)"><rect width="300" height="128" rx="20" fill="#101d2b" stroke="#ffffff" stroke-opacity=".07"/><text x="22" y="31" font-size="12" fill="#63d3c2">02 · DOMÍNIO</text><text x="22" y="61" font-size="18" font-weight="700" fill="#edf1f4">Mastery + SRS</text><text x="22" y="84" font-size="12" fill="#83909d">recall espaçado, erros e gates</text><text x="22" y="106" font-size="12" fill="#83909d">antes de liberar dificuldade</text></g>
<g transform="translate(710 172)"><rect width="300" height="128" rx="20" fill="#101d2b" stroke="#ffffff" stroke-opacity=".07"/><text x="22" y="31" font-size="12" fill="#f4a9bb">03 · MEMÓRIA</text><text x="22" y="61" font-size="18" font-weight="700" fill="#edf1f4">Kanji Memory Lab</text><text x="22" y="84" font-size="12" fill="#83909d">famílias, contraste, forma e leitura</text><text x="22" y="106" font-size="12" fill="#83909d">produção antes da resposta</text></g>
<g transform="translate(1030 172)"><rect width="300" height="128" rx="20" fill="#101d2b" stroke="#ffffff" stroke-opacity=".07"/><text x="22" y="31" font-size="12" fill="#8ebee5">04 · SOM</text><text x="22" y="61" font-size="18" font-weight="700" fill="#edf1f4">Pronunciation Lab</text><text x="22" y="84" font-size="12" fill="#83909d">mora, っ, ん, duração e shadowing</text><text x="22" y="106" font-size="12" fill="#83909d">sem score fonético enganoso</text></g>
<g transform="translate(70 320)"><rect width="300" height="128" rx="20" fill="#101d2b" stroke="#ffffff" stroke-opacity=".07"/><text x="22" y="31" font-size="12" fill="#ef8d82">05 · VIDA REAL</text><text x="22" y="61" font-size="18" font-weight="700" fill="#edf1f4">Survival Missions</text><text x="22" y="84" font-size="12" fill="#83909d">cenários ramificados e reparo</text><text x="22" y="106" font-size="12" fill="#83909d">tarefas com objetivo observável</text></g>
<g transform="translate(390 320)"><rect width="300" height="128" rx="20" fill="#101d2b" stroke="#ffffff" stroke-opacity=".07"/><text x="22" y="31" font-size="12" fill="#c49be5">06 · CONTINUIDADE</text><text x="22" y="61" font-size="18" font-weight="700" fill="#edf1f4">Diário no Japão</text><text x="22" y="84" font-size="12" fill="#83909d">personagens, lugares e episódios</text><text x="22" y="106" font-size="12" fill="#83909d">que retornam ao longo do curso</text></g>
<g transform="translate(710 320)"><rect width="300" height="128" rx="20" fill="#101d2b" stroke="#ffffff" stroke-opacity=".07"/><text x="22" y="31" font-size="12" fill="#d7b56d">07 · CONTEÚDO</text><text x="22" y="61" font-size="18" font-weight="700" fill="#edf1f4">Vídeos + leitura</text><text x="22" y="84" font-size="12" fill="#83909d">apoio visual carregado sob demanda</text><text x="22" y="106" font-size="12" fill="#83909d">sem pesar no boot</text></g>
<g transform="translate(1030 320)"><rect width="300" height="128" rx="20" fill="#5a1d24" stroke="#e64d3d" stroke-opacity=".35"/><text x="22" y="31" font-size="12" fill="#f3b6ad">08 · ENGENHARIA</text><text x="22" y="61" font-size="18" font-weight="700" fill="#ffffff">PWA + lazy runtime</text><text x="22" y="84" font-size="12" fill="#d9a8a4">offline, budgets e CI</text><text x="22" y="106" font-size="12" fill="#d9a8a4">performance como contrato</text></g>
</g></svg>