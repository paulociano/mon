name: MON Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0 | xargs -0 -n1 node --check
      - name: Static contracts
        run: node scripts/verify.mjs
      - name: Review scheduler behavior
        run: node scripts/test-review-scheduler.mjs
      - name: Curriculum content contracts
        run: node scripts/test-content-packs.mjs
      - name: MON learning methods
        run: node scripts/test-learning-methods.mjs
