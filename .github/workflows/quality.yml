name: MON Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JavaScript syntax
        run: |
          find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./.git/*" -print0 | xargs -0 -n1 node --check
      - name: Repository quality and security
        run: node scripts/test-repository-quality.mjs
      - name: Accessibility contracts
        run: node scripts/test-accessibility-contracts.mjs
      - name: Typography contracts
        run: node scripts/test-typography-contracts.mjs
      - name: Static contracts
        run: node scripts/verify.mjs
      - name: Review scheduler behavior
        run: node scripts/test-review-scheduler.mjs
      - name: State persistence and recovery
        run: node scripts/test-state-persistence.mjs
      - name: Account and sync boundary
        run: node scripts/test-account-boundary.mjs
      - name: Backup import and upgrade
        run: node scripts/test-backup-import.mjs
      - name: Supabase cloud contracts
        run: node scripts/test-supabase-cloud.mjs
      - name: Multi-device sync behavior
        run: node scripts/test-multi-device-sync.mjs
      - name: Curriculum content contracts
        run: node scripts/test-content-packs.mjs
      - name: Level content pack routing
        run: node scripts/test-content-pack-routing.mjs
      - name: Content quality
        run: node scripts/test-content-quality.mjs
      - name: Narrative network
        run: node scripts/test-narrative-network.mjs
      - name: Narrative persistence
        run: node scripts/test-narrative-state.mjs
      - name: Japan Journal
        run: node scripts/test-japan-journal.mjs
      - name: Video Library
        run: node scripts/test-video-library.mjs
      - name: Listening and Pronunciation Lab
        run: node scripts/test-pronunciation-lab.mjs
      - name: Kanji Memory Lab 2.0
        run: node scripts/test-kanji-memory-lab.mjs
      - name: Guided Kanji Atlas
        run: node scripts/test-kanji-atlas-redesign.mjs
      - name: Survival Missions 2.0
        run: node scripts/test-survival-missions-v2.mjs
      - name: README showcase
        run: node scripts/test-readme-showcase.mjs
      - name: MON learning methods
        run: node scripts/test-learning-methods.mjs
      - name: Grammar study layer
        run: node scripts/test-grammar-study.mjs
      - name: N5 applied grammar study
        run: node scripts/test-n5-grammar-study.mjs
      - name: Canonical grammar pedagogy
        run: node scripts/test-grammar-catalog-pedagogy.mjs
      - name: Adaptive grammar remediation
        run: node scripts/test-grammar-remediation.mjs
      - name: Japanese learning cycle
        run: node scripts/test-japanese-learning-cycle.mjs
      - name: Foundation lesson variety
        run: node scripts/test-foundation-variety.mjs
      - name: Energy policy
        run: node scripts/test-energy-policy.mjs
      - name: Adaptive teaching mix
        run: node scripts/test-adaptive-methods.mjs
      - name: Mastery graph behavior
        run: node scripts/test-mastery-graph.mjs
      - name: Learning evidence behavior
        run: node scripts/test-learning-evidence.mjs
      - name: Learning metrics semantics
        run: node scripts/test-learning-metrics.mjs
      - name: Longitudinal learning validation
        run: node scripts/test-learning-validation.mjs
      - name: Mastery progression behavior
        run: node scripts/test-mastery-progression.mjs
      - name: Practical N5 curriculum scale
        run: node scripts/test-n5-scale.mjs
      - name: Deep N5 curriculum audit
        run: node scripts/test-n5-depth.mjs
      - name: N4 capability contracts
        run: node scripts/test-n4-capabilities.mjs
      - name: N5 readiness governance
        run: node scripts/test-n5-readiness.mjs
      - name: Home polish contracts
        run: node scripts/test-home-polish.mjs
      - name: Guided learning journey
        run: node scripts/test-learning-journey.mjs
      - name: Deep-link navigation
        run: node scripts/test-deep-links.mjs
      - name: Router structural integrity
        run: node scripts/test-router-integrity.mjs
      - name: JavaScript parser check
        run: |
          node --check app.js
          for file in features/*.js core/*.js data/*.js; do node --check "$file"; done
      - name: Lazy runtime dependencies
        run: node scripts/test-lazy-runtime-deps.mjs
      - name: Generated section banners
        run: node scripts/test-section-banners.mjs
      - name: Adaptive Home Coach
        run: node scripts/test-home-coach.mjs
      - name: Home interaction routing
        run: node scripts/test-home-interactions.mjs
      - name: Next Best Lesson Engine
        run: node scripts/test-next-best-lesson.mjs
      - name: Adaptive Daily Loop
        run: node scripts/test-daily-loop.mjs
      - name: Performance budgets
        run: node scripts/test-performance-budget.mjs
      - name: PWA shell and update flow
        run: node scripts/test-pwa-runtime.mjs
      - name: Lazy feature split
        run: node scripts/test-feature-split.mjs
      - name: Lazy experiences and telemetry
        run: node scripts/test-lazy-experiences.mjs
      - name: Lazy dataset split
        run: node scripts/test-dataset-split.mjs
      - name: Lazy Lesson UI
        run: node scripts/test-lazy-lesson-ui.mjs
      - name: Local Performance Lab
        run: node scripts/test-performance-lab.mjs
      - name: Latency calibration contracts
        run: node scripts/test-latency-calibration.mjs
      - name: Practice Hub
        run: node scripts/test-practice-hub.mjs


  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Chromium smoke runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve MON
        run: |
          python3 -m http.server 4173 > /tmp/mon-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/mon-http.log
          exit 1
      - name: Browser smoke
        run: node scripts/test-browser-smoke.mjs
      - name: Latency baseline
        run: node scripts/measure-latency-baseline.mjs
      - name: Multi-round latency calibration
        run: node scripts/calibrate-latency-baseline.mjs
      - name: Responsive smoke
        run: node scripts/test-responsive-smoke.mjs
      - name: P8 secondary responsive smoke
        run: node scripts/test-p8-secondary-responsive.mjs
      - name: Offline PWA smoke
        run: node scripts/test-offline-smoke.mjs


  cross-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve MON
        run: |
          python3 -m http.server 4173 > /tmp/mon-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/mon-http.log
          exit 1
      - name: Cross-browser smoke
        env:
          MON_BROWSER: ${{ matrix.browser }}
        run: node scripts/test-cross-browser-smoke.mjs
      - name: Cross-browser latency calibration
        env:
          MON_BROWSER: ${{ matrix.browser }}
          MON_LATENCY_ROUNDS: 3
        run: node scripts/calibrate-latency-baseline.mjs
